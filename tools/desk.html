<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;background:radial-gradient(70% 80% at 15% 20%,#c9c2ff,transparent 60%),radial-gradient(60% 70% at 90% 90%,#8f86ff,transparent 65%),linear-gradient(160deg,#e9e6ff,#b4acff 60%,#7b70f0);position:relative}
.mb{position:absolute;inset:0 0 auto 0;height:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 18px;font-size:13.5px;color:#1d1d1f;gap:22px}
.mb b{font-weight:700}.mb .r{margin-left:auto;display:flex;gap:18px;align-items:center}
.mb .ic{width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.12);display:grid;place-items:center}
.mb .ic img{width:18px;height:18px}
.pop{position:absolute;top:40px;right:110px;width:513px;height:648px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 70px -20px rgba(30,20,90,.55)}
.pop img{width:100%;height:100%;display:block}
.arrow{position:absolute;top:33px;right:224px;width:16px;height:16px;background:#f6f6f7;transform:rotate(45deg);border-radius:2px;box-shadow:-.5px -.5px 0 rgba(0,0,0,.18)}
.hero{position:absolute;left:84px;top:200px;width:600px;color:#1c1640}
.hero img{width:190px;height:190px;margin-left:-22px;filter:drop-shadow(0 20px 30px rgba(40,20,120,.25))}
.hero h1{font-size:54px;letter-spacing:-.02em;margin:8px 0 10px;font-weight:800}
.hero p{font-size:22px;line-height:1.45;margin:0 0 26px;color:#352d6b;max-width:560px}
.keys{display:flex;gap:12px;flex-wrap:wrap}
.keys span{background:rgba(255,255,255,.7);border-radius:10px;padding:9px 14px;font-size:17px;color:#2a2260;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.keys kbd{font:600 17px ui-monospace,SFMono-Regular,monospace;margin-right:6px}
</style></head><body>
<div class="mb"><b></b><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span>
<div class="r"><span class="ic"><img src="icon.png" alt=""></span><span>Wi‑Fi</span><span>Mon 16 Nov&nbsp; 6:24 PM</span></div></div>
<div class="arrow"></div>
<div class="pop"><img src="desk-panel.png" alt=""></div>
<div class="hero"><img src="icon.png" alt=""><h1>Clipboard History</h1><p>Every copy, text and images, saved quietly in the menu bar. Find it again in a keystroke.</p>
<div class="keys"><span><kbd>⌃⌘V</kbd>open</span><span><kbd>⌘1–9</kbd>quick pick</span><span><kbd>⇧⌘C</kbd>copy all</span></div></div>
</body></html>
